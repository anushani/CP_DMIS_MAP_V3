<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMIS Central Province Project Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%231a5926%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<style>
  :root{
    --green:#8e2616; --green-d:#511409; --ink:#1d2a21; --muted:#5d6b61; --line:#dfe5e0;
    --bg:#f4f7f4; --card:#ffffff; --accent:#1f6fb5;
    --c0:#fbefec; --c1:#f2c9c0; --c2:#e39485; --c3:#c4513f; --c4:#8e2616;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Sinhala","Iskoola Pota",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
  header{background:var(--green);color:#fff;padding:8px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  header small{opacity:.8;font-weight:400}
  .controls{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
  select,input[type=search]{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:#fff;color:var(--ink)}
  label.chk{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
  main{flex:1;min-height:0;display:flex}
  #map{flex:1;min-width:0;background:#dfe9e2}
  aside{width:380px;max-width:42vw;background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:16px}
  @media(max-width:800px){
    main{flex-direction:column} #map{flex:none;height:52vh}
    aside{width:auto;max-width:none;border-left:0;border-top:1px solid var(--line);flex:1}
    header .controls{margin-left:0;width:100%}
  }
  h2{font-size:17px;margin:0 0 2px} h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
  .sub{color:var(--muted);margin-bottom:10px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums} .kpi span{font-size:12px;color:var(--muted)}
  .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#eee;margin:6px 0}
  .bar i{display:block;height:100%}
  .bl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
  .bl span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--c)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
  td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.row{cursor:pointer} tr.row:hover td{background:#f1f7f2}
  .pname{font-weight:500} .pmeta{font-size:12px;color:var(--muted)}
  .note{background:#fff7ea;border:1px solid #f0d9ae;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#6a4a10;margin-top:12px}
  button.link{background:none;border:0;color:var(--green);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
  .legend{background:rgba(255,255,255,.95);padding:8px 10px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.25);line-height:1.5;font-size:12px}
  .legend b{display:block;margin-bottom:4px}
  .legend i{display:inline-block;width:16px;height:12px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
  .leaflet-popup.ds-tip .leaflet-popup-content{margin:10px 14px} .ds-tip{font:13px/1.35 system-ui,sans-serif;border-radius:6px}
  .dsname{font:600 11px system-ui,sans-serif;color:#102014;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap;pointer-events:none;background:none;border:0;box-shadow:none}
  .dsname::before{display:none}
  .distname{font-size:13px;letter-spacing:.12em;color:var(--green-d);opacity:.75}
  #err{display:none;padding:16px;color:#8a1c1c}
  .seg{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:6px;overflow:hidden}
  .seg button{font:inherit;background:transparent;color:#fff;border:0;padding:6px 12px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--green);font-weight:600}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ccard{font:inherit;text-align:left;background:#fff7ea;border:1px solid #f0d9ae;border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
  .ccard:hover{background:#ffefd2} .ccard b{font-size:13px} .ccard span{font-size:12px;color:#6a4a10;font-variant-numeric:tabular-nums}
  .commonctl{min-width:170px;padding:8px} .commonctl .pmeta{margin-bottom:4px}
  .cchip{font:inherit;font-size:12.5px;display:flex;justify-content:space-between;gap:10px;width:100%;margin-top:3px;background:#fff7ea;border:1px solid #f0d9ae;border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--ink)}
  .cchip:hover{background:#ffefd2}
  .chead{font:inherit;display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:0 0 2px;cursor:pointer;color:var(--ink)}
  .search{width:100%;border:1px solid var(--line);margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>DMIS Central Province <small>· Approved projects by Divisional Secretariat</small></h1>
  <div class="controls">
    <div class="seg" id="mode" role="group" aria-label="Map level"><button data-m="ds" class="on" aria-pressed="true">DS divisions</button><button data-m="district" aria-pressed="false">Districts</button></div>
    <select id="metric" aria-label="Map shows"></select>
    <select id="dsPick" aria-label="Find a DS division"><option value="">Find DS division…</option></select>
    <label class="chk"><input type="checkbox" id="base" checked> Base map</label>
    <label class="chk"><input type="checkbox" id="labels" checked> Labels</label>
  </div>
</header>
<main>
  <div id="map" role="application" aria-label="Map of Central Province"></div>
  <aside id="panel" aria-live="polite"><div id="err"></div></aside>
</main>

<script src="lib/leaflet/leaflet.js"></script>
<script>
/* ============ SETTINGS (edit here) ============ */
const CONFIG = {
  boundaries : 'data/ds.geojson',
  districts  : 'data/district.geojson',
  // ---- LIVE DATA (DMIS developer: change these URLs to the real endpoints, see HANDOVER.md) ----
  stats      : 'data/stats.json',      // e.g. '/gis/api/ds-stats'  (JSON with "meta", "ds" and "common")
  projects   : 'data/projects.json',   // sample/static: all project lists in one file
  projectsByDs : null,                 // live: e.g. '/gis/api/ds-projects?ds={key}'  ({key} = 21-27 or common-kandy)
  refreshSeconds : 0,                  // e.g. 60 = re-fetch stats every minute
  tiles : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  attribution : '© OpenStreetMap contributors'
};
const METRICS = {
  alloc : {label:'Allocated amount (Rs.)',      get:s=>s.alloc,                           fmt:v=>money(v)},
  count : {label:'Number of projects',          get:s=>s.count,                           fmt:v=>v.toLocaleString()},
  wpct  : {label:'Financial progress % (weighted by Rs.)', get:s=>s.wpct,                 fmt:v=>v.toFixed(1)+'%'},
  done  : {label:'Projects at 100% physical progress', get:s=>s.count?100*s.completed/s.count:0, fmt:v=>v.toFixed(0)+'%'}
};
const CATS = [['0-10','#c0392b'],['11-24','#e67e22'],['25-49','#f1c40f'],['50-74','#9bc53d'],['75-99','#4f9c5c'],['100','#1f6b37']];
/* ---- colour themes: main = header/buttons, dark = outlines, accent = selection highlight, ramp = map classes (light -> dark) ---- */
const THEME = {main:'#8e2616',dark:'#511409',accent:'#1f6fb5',ramp:['#fbefec','#f2c9c0','#e39485','#c4513f','#8e2616']};   // Maroon theme: edit these colours to change the look

let RAMP = THEME.ramp, ACCENT = THEME.accent, OUTLINE = THEME.dark;
function applyTheme(){
  const r = document.documentElement.style;
  r.setProperty('--green',THEME.main); r.setProperty('--green-d',THEME.dark); r.setProperty('--accent',THEME.accent);
}

/* ============ helpers ============ */
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k==='class') e.className=v; else if (k.startsWith('on')) e[k]=v; else if (k==='style') e.style.cssText=v; else e.setAttribute(k,v);
  }
  kids.flat().forEach(c => e.append(c instanceof Node ? c : document.createTextNode(c ?? '')));
  return e;
}
function money(v){
  if (v>=1e9) return 'Rs. '+(v/1e9).toFixed(2)+' Bn';
  if (v>=1e6) return 'Rs. '+(v/1e6).toFixed(1)+' M';
  return 'Rs. '+Math.round(v).toLocaleString();
}
const full = v => 'Rs. '+Math.round(v).toLocaleString();

/* ============ state ============ */
let map, dsLayer, distLayer, distFill, labelLayer, baseLayer, legend, commonCtl;
let stats = {}, common = {}, meta = {}, projects = null, metric = 'alloc', breaks = [];
let commonOpen;
let mode = 'ds', selected = null, selDist = null, selCommon = null, panelToken = 0;
const layers = {}, distLayers = {}, projByKey = {};   // DS key -> layer ; district name -> layer ; project cache

/* ============ aggregation (district totals = DS-mapped + that district's common) ============ */
function sumStats(list){
  const r = {count:0,alloc:0,fin:0,completed:0,cats:{},avgsum:0};
  list.forEach(s=>{ if(!s) return; r.count+=s.count; r.alloc+=s.alloc; r.fin+=s.fin; r.completed+=s.completed||0; r.avgsum+=(s.avgpct||0)*s.count;
    CATS.forEach(([c])=>r.cats[c]=(r.cats[c]||0)+(s.cats&&s.cats[c]||0)); });
  r.wpct = r.alloc ? 100*r.fin/r.alloc : 0; r.avgpct = r.count ? r.avgsum/r.count : 0; return r;
}
const commonFor = name => Object.values(common).find(c=>c.district===name);
function districtStats(name){
  const ds = Object.values(layers).filter(l=>l.feature.properties.district===name).map(l=>stats[l.feature.properties.key]);
  const com = commonFor(name);
  return {located:sumStats(ds), common:sumStats([com]), total:sumStats([...ds,com])};
}
const pct = (a,b) => b ? (100*a/b).toFixed(1)+'%' : '—';

/* ============ load ============ */
async function getJSON(u){ const r = await fetch(u + (u.includes('?')?'&':'?') + 't=' + Date.now()); if(!r.ok) throw new Error(u+' → '+r.status); return r.json(); }

async function init(){
  applyTheme();
  map = L.map('map',{zoomSnap:.25,minZoom:8}).setView([7.4,80.7],9);
  baseLayer = L.tileLayer(CONFIG.tiles,{attribution:CONFIG.attribution,maxZoom:16,opacity:.55}).addTo(map);
  try{
    const [ds, dist, st] = await Promise.all([getJSON(CONFIG.boundaries), getJSON(CONFIG.districts), getJSON(CONFIG.stats)]);
    stats = st.ds; common = st.common||{}; meta = st.meta;
    buildDS(ds); buildDistricts(dist);
    fitAll();
    map.setMaxBounds(dsLayer.getBounds().pad(1.2));
  }catch(e){ const x=$('err'); x.style.display='block'; x.textContent='Could not load data: '+e.message+'. If you opened index.html by double-clicking, run a local web server instead (see README).'; return; }

  Object.entries(METRICS).forEach(([k,m])=>$('metric').append(el('option',{value:k},m.label)));
  $('metric').onchange = e => { metric = e.target.value; restyle(); };
  [...Object.values(layers)].map(l=>l.feature.properties).sort((a,b)=>a.name.localeCompare(b.name))
    .forEach(p=>$('dsPick').append(el('option',{value:p.key},`${p.name} (${p.district})`)));
  $('dsPick').onchange = e => e.target.value && select(e.target.value, true);
  $('base').onchange = e => e.target.checked ? baseLayer.addTo(map) : map.removeLayer(baseLayer);
  $('labels').onchange = updateLabels;
  document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{ if(b.dataset.m===mode) return; resetSel(); setMode(b.dataset.m); showOverview(); fitAll(); });

  restyle(); updateLabels(); showOverview();
  if (CONFIG.refreshSeconds>0) setInterval(refresh, CONFIG.refreshSeconds*1000);
}
async function refresh(){
  try{ const st = await getJSON(CONFIG.stats); stats = st.ds; common = st.common||{}; meta = st.meta; restyle(); rerenderPanel(); }catch(e){ console.warn(e); }
}
function rerenderPanel(){ selCommon ? showCommon(selCommon) : selDist ? showDistrict(selDist) : selected ? showDS(selected) : showOverview(); }
const fitAll = () => map.fitBounds(dsLayer.getBounds(),{padding:[10,10]});

/* ============ map layers ============ */
function buildDS(geo){
  dsLayer = L.geoJSON(geo,{
    style:()=>({weight:1,color:'#fff',fillOpacity:.85,fillColor:'#ddd'}),
    onEachFeature:(f,l)=>{
      layers[f.properties.key]=l;
      l.on({mouseover:()=>hover(l,true), mouseout:()=>hover(l,false), click:()=>select(f.properties.key,false)});
      l.bindPopup(()=>tip(f.properties),{className:'ds-tip',closeButton:true,autoPan:false});   // popup opens on CLICK only
    }
  }).addTo(map);
  labelLayer = L.layerGroup();
  Object.values(layers).forEach(l=>{
    const p = l.feature.properties;
    L.marker(l.getBounds().getCenter(),{interactive:false,icon:L.divIcon({className:'dsname',html:shortName(p.name),iconSize:null})}).addTo(labelLayer);
  });
  labelLayer.addTo(map);
  map.on('zoomend',updateLabels);
}
function updateLabels(){
  const on = $('labels').checked, z = map.getZoom();
  labelLayer.eachLayer(m=>{ const e=m.getElement(); if(!e) return;
    const isDist = e.classList.contains('distname');
    const vis = isDist ? (mode==='district' || z<10) : (mode==='ds' && z>=10);
    e.style.display = on && vis ? '' : 'none'; });
}
const shortName = n => n.length>18 ? n.replace(' Four Gravets & Gangawata Korale',' 4G & Gangawata') : n;
function buildDistricts(geo){
  distLayer = L.geoJSON(geo,{interactive:false,style:()=>({weight:2.4,color:OUTLINE,fill:false,opacity:.9})}).addTo(map);
  distFill = L.geoJSON(geo,{            // clickable district polygons, only on the map in "Districts" mode
    style:()=>({weight:1.5,color:'#fff',fillOpacity:.85,fillColor:'#ddd'}),
    onEachFeature:(f,l)=>{
      const n = f.properties.district; distLayers[n]=l;
      l.on({mouseover:()=>{ if(selDist!==n) l.setStyle({weight:3,color:ACCENT}); }, mouseout:()=>{ if(selDist!==n) l.setStyle({weight:1.5,color:'#fff'}); }, click:()=>selectDistrict(n,false)});
      l.bindPopup(()=>tipDist(n),{className:'ds-tip',closeButton:true,autoPan:false});
    }});
  distLayer.eachLayer(l=>L.marker(l.getBounds().getCenter(),{interactive:false,
    icon:L.divIcon({className:'dsname distname',html:l.feature.properties.district.toUpperCase(),iconSize:null})}).addTo(labelLayer));
}
function setMode(m){
  mode = m;
  document.querySelectorAll('#mode button').forEach(b=>{ const on=b.dataset.m===m; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  if(m==='ds'){ map.removeLayer(distFill); dsLayer.addTo(map); } else { map.removeLayer(dsLayer); distFill.addTo(map); }
  distLayer.bringToFront(); map.closePopup(); restyle(); updateLabels();
}
function tip(p){
  const s = stats[p.key]; const m = METRICS[metric];
  const d = el('div',{}, el('b',{},p.name), el('div',{style:'color:#5d6b61'},p.district));
  if(!s){ d.append(el('div',{},'No projects')); return d; }
  d.append(el('div',{},m.label+': ', el('b',{},m.fmt(m.get(s)))), el('div',{style:'color:#5d6b61'},s.count+' projects · '+s.wpct.toFixed(0)+'% spent'));
  return d;
}
function tipDist(n){
  const t = districtStats(n).total, m = METRICS[metric];
  return el('div',{}, el('b',{},n+' district'), el('div',{style:'color:#5d6b61'},'incl. district common projects'),
    el('div',{},m.label+': ', el('b',{},m.fmt(m.get(t)))), el('div',{style:'color:#5d6b61'},t.count.toLocaleString()+' projects · '+t.wpct.toFixed(0)+'% spent'));
}
function hover(l,on){ if(selected===l.feature.properties.key) return; l.setStyle(on?{weight:3,color:ACCENT}:{weight:1,color:'#fff'}); if(on) l.bringToFront(); distLayer&&distLayer.bringToFront(); }

function computeBreaks(){
  if(mode==='district'){                                   // only 3 districts → equal intervals
    const v = Object.keys(distLayers).map(n=>METRICS[metric].get(districtStats(n).total));
    const lo = Math.min(...v), hi = Math.max(...v);
    breaks = [1,2,3,4].map(i=>lo+(hi-lo)*i/5); return;
  }
  const vals = Object.values(stats).map(METRICS[metric].get).filter(v=>v>0).sort((a,b)=>a-b);
  breaks = [1,2,3,4].map(i=>vals[Math.floor(vals.length*i/5)]);       // quantiles → 5 classes
}
const colorFor = v => v<=0 ? '#eee' : RAMP[breaks.filter(b=>v>=b).length];
function restyle(){
  computeBreaks();
  if(mode==='ds'){
    Object.entries(layers).forEach(([k,l])=>{ const s = stats[k]; l.setStyle({fillColor: s?colorFor(METRICS[metric].get(s)):'#eee', fillOpacity:.85}); });
    if(selected) layers[selected].setStyle({weight:3.5,color:ACCENT});
  } else {
    Object.entries(distLayers).forEach(([n,l])=>l.setStyle({fillColor:colorFor(METRICS[metric].get(districtStats(n).total)),fillOpacity:.85}));
    if(selDist) distLayers[selDist].setStyle({weight:3.5,color:ACCENT});
  }
  drawLegend(); drawCommonControl();
}
function drawLegend(){
  if(legend) map.removeControl(legend);
  legend = L.control({position:'bottomleft'});
  legend.onAdd = ()=>{
    const m = METRICS[metric], d = el('div',{class:'legend'}, el('b',{},m.label), mode==='district'?el('div',{class:'pmeta'},'District total incl. common projects'):'');
    const edges = [0,...breaks];
    RAMP.forEach((c,i)=>{
      const lo = edges[i], hi = edges[i+1];
      d.append(el('div',{}, el('i',{style:'background:'+c}), i===0?'< '+m.fmt(hi): hi===undefined?'≥ '+m.fmt(lo): m.fmt(lo)+' – '+m.fmt(hi)));
    });
    d.append(el('div',{}, el('i',{style:'background:#eee'}),'No data'));
    return d;
  };
  legend.addTo(map);
}
function drawCommonControl(){                 // "common" projects have no DS → cannot be drawn; shown as clickable chips
  if(commonCtl) map.removeControl(commonCtl);
  const list = Object.entries(common); if(!list.length) return;
  commonCtl = L.control({position:'topright'});
  commonCtl.onAdd = ()=>{
    const open = commonOpen ??= window.innerWidth > 800;
    const body = el('div',{style:open?'':'display:none'}, el('div',{class:'pmeta'},'Click to open the project list'));
    list.forEach(([id,c])=>body.append(el('button',{class:'cchip',onclick:()=>showCommonSel(id),title:money(c.alloc)}, el('span',{},c.name), el('b',{},c.count.toLocaleString()))));
    const head = el('button',{class:'chead','aria-expanded':open,onclick:()=>{ commonOpen=!commonOpen; drawCommonControl(); }},
      el('b',{},'Not on the DS map'), el('span',{},commonOpen?'▾':'▸'));
    const d = el('div',{class:'legend commonctl'}, head, body);
    L.DomEvent.disableClickPropagation(d); return d;
  };
  commonCtl.addTo(map);
}

/* ============ selection ============ */
function resetSel(){
  if(selected && layers[selected]) layers[selected].setStyle({weight:1,color:'#fff'});
  if(selDist && distLayers[selDist]) distLayers[selDist].setStyle({weight:1.5,color:'#fff'});
  selected = selDist = selCommon = null; $('dsPick').value=''; map.closePopup();
}
function select(key, zoom){
  if(mode!=='ds') setMode('ds');
  resetSel(); selected = key;
  const l = layers[key]; l.setStyle({weight:3.5,color:ACCENT}); l.bringToFront(); distLayer.bringToFront();
  if(zoom) map.fitBounds(l.getBounds(),{padding:[40,40]});
  $('dsPick').value = key; showDS(key);
}
function selectDistrict(name, zoom){
  if(mode!=='district') setMode('district');
  resetSel(); selDist = name;
  const l = distLayers[name]; l.setStyle({weight:3.5,color:ACCENT}); distLayer.bringToFront();
  if(zoom) map.fitBounds(l.getBounds(),{padding:[30,30]});
  showDistrict(name);
}
function showCommonSel(id){ resetSel(); selCommon = id; showCommon(id); }
function backToOverview(){ resetSel(); showOverview(); fitAll(); }

/* ============ panel ============ */
function put(...nodes){ const p=$('panel'); panelToken++; [...p.children].forEach(c=>c.id!=='err'&&c.remove()); p.append(...nodes); p.scrollTop=0; return panelToken; }
const kpi = (v,l)=>el('div',{class:'kpi'},el('b',{},v),el('span',{},l));
const back = () => el('button',{class:'link',onclick:backToOverview},'← Province overview');

function progressBar(cats){
  const total = Object.values(cats).reduce((a,b)=>a+b,0)||1;
  const bar = el('div',{class:'bar',role:'img','aria-label':'Physical progress distribution'});
  const lg = el('div',{class:'bl'});
  CATS.forEach(([c,col])=>{
    const n = cats[c]||0;
    bar.append(el('i',{style:`width:${100*n/total}%;background:${col}`,title:`${c}%: ${n} projects`}));
    lg.append(el('span',{style:'--c:'+col},`${c}%: ${n}`));
  });
  return [bar,lg];
}
function splitBar(a, b){          // DS-mapped vs common, by allocated amount
  const t = (a.alloc+b.alloc)||1;
  return [ el('div',{class:'bar',role:'img','aria-label':'Share of allocation on DS map vs common'},
      el('i',{style:`width:${100*a.alloc/t}%;background:var(--green)`,title:'On DS map'}), el('i',{style:`width:${100*b.alloc/t}%;background:var(--accent)`,title:'Common'})),
    el('div',{class:'bl'}, el('span',{style:'--c:var(--green)'},`On DS map: ${pct(a.alloc,t)} (${money(a.alloc)})`), el('span',{style:'--c:var(--accent)'},`Common: ${pct(b.alloc,t)} (${money(b.alloc)})`)) ];
}
function commonCard(id,c){
  return el('button',{class:'ccard',onclick:()=>showCommonSel(id)}, el('b',{},c.name), el('span',{},c.count.toLocaleString()+' projects'),
    el('span',{},money(c.alloc)+' · '+c.wpct.toFixed(0)+'% spent'));
}

function showOverview(){
  const located = sumStats(Object.values(stats)), all = sumStats([...Object.values(stats),...Object.values(common)]);
  const comTot = sumStats(Object.values(common));
  const names = [...new Set(Object.values(layers).map(l=>l.feature.properties.district))].sort();
  const nodes = [
    el('h2',{},'Central Province'),
    el('div',{class:'sub'},'Click a DS division (or switch to Districts). Data loaded '+(meta.data_date||meta.generated||'—')),
    el('div',{class:'kpis'}, kpi(all.count.toLocaleString(),'projects in total'), kpi(money(all.alloc),'allocated'),
      kpi(all.wpct.toFixed(1)+'%','of allocation spent'), kpi(pct(located.count,all.count),'of projects have a DS (drawn on map)')),
    el('h3',{},'Where the money is'), ...splitBar(located,comTot),
    el('h3',{},'Physical progress (all projects)'), ...progressBar(all.cats),
    el('h3',{},'Common projects – no single DS, not drawn'),
    el('div',{class:'cgrid'}, Object.entries(common).map(([id,c])=>commonCard(id,c))),
    el('div',{class:'pmeta',style:'margin-top:6px'},'DMIS books these at district or province level (training, equipment, programmes) or without a DS. They are counted in the district totals, but have no place on a DS polygon.'),
    el('h3',{},'By district (incl. common)'),
    el('table',{}, el('tr',{},el('th',{},'District'),el('th',{class:'n'},'Projects'),el('th',{class:'n'},'Allocated'),el('th',{class:'n'},'Spent')),
      names.map(n=>{ const d=districtStats(n); return el('tr',{class:'row',onclick:()=>selectDistrict(n,true)},
        el('td',{}, el('div',{class:'pname'},n), el('div',{class:'pmeta'},`${d.located.count.toLocaleString()} on map · ${d.common.count.toLocaleString()} common`)),
        el('td',{class:'n'},d.total.count.toLocaleString()), el('td',{class:'n'},money(d.total.alloc)), el('td',{class:'n'},d.total.wpct.toFixed(1)+'%')); }),
      el('tr',{},el('td',{}, el('div',{class:'pname'},'Provincial common'), el('div',{class:'pmeta'},'no district')),
        ...(()=>{ const c=Object.values(common).find(x=>!x.district); return c ? [el('td',{class:'n'},c.count.toLocaleString()),el('td',{class:'n'},money(c.alloc)),el('td',{class:'n'},c.wpct.toFixed(1)+'%')] : [el('td'),el('td'),el('td')]; })()))
  ];
  put(...nodes);
}

function showDistrict(name){
  const d = districtStats(name), com = commonFor(name);
  const dsRows = Object.values(layers).map(l=>l.feature.properties).filter(p=>p.district===name).sort((a,b)=>(stats[b.key]?.alloc||0)-(stats[a.key]?.alloc||0));
  put(back(), el('h2',{},name+' district'), el('div',{class:'sub'},'Totals include the district’s common projects'),
    el('div',{class:'kpis'}, kpi(d.total.count.toLocaleString(),'projects'), kpi(money(d.total.alloc),'allocated'),
      kpi(money(d.total.fin),'financial progress'), kpi(d.total.wpct.toFixed(1)+'%','of allocation spent')),
    el('h3',{},'On DS map vs common'), ...splitBar(d.located,d.common),
    com ? el('div',{class:'cgrid',style:'margin-top:8px'}, commonCard(Object.keys(common).find(k=>common[k]===com),com)) : '',
    el('h3',{},'Physical progress (all projects)'), ...progressBar(d.total.cats),
    el('h3',{},'DS divisions'),
    el('table',{}, el('tr',{},el('th',{},'DS division'),el('th',{class:'n'},'Projects'),el('th',{class:'n'},'Allocated'),el('th',{class:'n'},'Spent')),
      dsRows.map(p=>{ const s=stats[p.key]||{count:0,alloc:0,wpct:0}; return el('tr',{class:'row',onclick:()=>select(p.key,true)},
        el('td',{},p.name), el('td',{class:'n'},s.count), el('td',{class:'n'},money(s.alloc)), el('td',{class:'n'},s.wpct.toFixed(1)+'%')); })));
}

function showDS(key){
  const f = layers[key].feature.properties, s = stats[key];
  if(!s){ put(back(), el('h2',{},f.name), el('div',{class:'sub'},f.district+' district'), el('p',{},'No projects recorded.')); return; }
  const tok = put(back(), el('h2',{},f.name+' DS'), el('div',{class:'sub'},f.district+' district'),
    el('div',{class:'kpis'}, kpi(s.count.toLocaleString(),'projects'), kpi(money(s.alloc),'allocated'),
      kpi(money(s.fin),'financial progress'), kpi(s.wpct.toFixed(1)+'%','of allocation spent')),
    el('h3',{},'Physical progress (projects)'), ...progressBar(s.cats),
    el('h3',{},'Projects'), el('div',{id:'plist'},'Loading…'));
  loadProjectList(key, tok);
}
function showCommon(id){
  const c = common[id]; if(!c){ backToOverview(); return; }
  const tok = put(back(), el('h2',{},c.name+' projects'),
    el('div',{class:'sub'}, c.district ? 'Booked to '+c.district+' district without a single DS division' : 'Province-wide projects (no district, no DS)'),
    el('div',{class:'kpis'}, kpi(c.count.toLocaleString(),'projects'), kpi(money(c.alloc),'allocated'),
      kpi(money(c.fin),'financial progress'), kpi(c.wpct.toFixed(1)+'%','of allocation spent')),
    c.multi_ds ? el('div',{class:'note'},`${c.multi_ds} of these span several DS divisions (named in the project list at source).`) : '',
    el('h3',{},'Physical progress (projects)'), ...progressBar(c.cats),
    el('h3',{},'Projects'), el('div',{id:'plist'},'Loading…'));
  loadProjectList(id, tok);
}
async function loadProjectList(key, tok){
  try{
    let rows;
    if(CONFIG.projectsByDs){ rows = projByKey[key] ||= await getJSON(CONFIG.projectsByDs.replace('{key}',encodeURIComponent(key))); }
    else { projects ||= await getJSON(CONFIG.projects); rows = projects[key]||[]; }
    if(tok!==panelToken) return;                 // user already clicked something else
    projectTable(rows);
  }catch(e){ if(tok===panelToken) $('plist').textContent='Could not load project list.'; }
}

function projectTable(list){
  let sort='alloc', dir=-1, q='';
  const box = $('plist'); box.textContent='';
  const search = el('input',{type:'search',class:'search',placeholder:'Search project name, code, agency…',
    oninput:e=>{q=e.target.value.toLowerCase();draw();}});
  const tbl = el('div',{}); box.append(search,tbl);
  const catColor = Object.fromEntries(CATS);
  function draw(){
    const rows = list.filter(r=>!q||(r[0]+r[1]+r[2]+r[3]).toLowerCase().includes(q))
      .sort((a,b)=> sort==='alloc'?dir*(a[4]-b[4]) : sort==='pct'?dir*(a[6]-b[6]) : dir*String(a[1]).localeCompare(String(b[1])));
    const th=(t,k,c)=>el('th',{class:c||'',onclick:()=>{dir=sort===k?-dir:-1;sort=k;draw();}},t+(sort===k?(dir<0?' ▾':' ▴'):''));
    const shown = rows.slice(0,100);
    tbl.textContent=''; tbl.append(
      el('table',{}, el('tr',{},th('Project','name'),th('Rs.','alloc','n'),th('Fin.%','pct','n')),
        shown.map(r=>el('tr',{title:`${r[0]}\n${r[2]}\n${r[3]}\nSpent ${full(r[5])}\n${r[8]} → ${r[9]}`},
          el('td',{}, el('div',{class:'pname'},r[1]), el('div',{class:'pmeta'},r[2]+' · '+r[3])),
          el('td',{class:'n'},money(r[4])),
          el('td',{class:'n'}, r[6].toFixed(0)+'%', el('div',{style:`height:4px;border-radius:2px;margin-top:3px;background:${catColor[r[7]]||'#ccc'}`,title:'Physical progress '+r[7]+'%'}))))),
      el('div',{class:'pmeta',style:'margin-top:6px'}, `${rows.length} project${rows.length===1?'':'s'}`+(rows.length>shown.length?` (showing first ${shown.length}; use search)`:'')+'. Bar colour = physical progress band.'));
  }
  draw();
}

init();
</script>
</body>
</html>
